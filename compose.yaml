services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: duel
      POSTGRES_PASSWORD: duel_local_only
      POSTGRES_DB: duel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - duel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duel -d duel"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  duel_postgres:
