name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: duel
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: duel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duel -d duel_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://duel:ci_only@localhost:5432/duel_test
      TEST_DATABASE_URL: postgresql://duel:ci_only@localhost:5432/duel_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:validate
      - run: npm run db:migrate
      - run: npm run content:import
      - run: npm run content:import
      - run: npm run test:db
      - run: npm run build
